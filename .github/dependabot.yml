version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Правило проєкту: релізи віком ≥ 7 днів.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      dev:
        dependency-type: development
        update-types: [minor, patch]
      prod:
        dependency-type: production
        update-types: [minor, patch]
