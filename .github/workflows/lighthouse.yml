name: Lighthouse

# Окремо від CI: локальна машина розробника перевантажена (контрольна порожня сторінка Next — performance 72–95),
# тож performance міряємо на чистому раннері. Пороги — scripts/lighthouse.mjs (рішення 11.11: a11y/BP/SEO ≥ 95, performance — за базовим рівнем фреймворку).
# Лише для готового PR (не чернетки) і вручну — рішення користувача 11.11: перевірки після готової сторінки.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Дані сайту — фейковий PostgREST з фікстурою (без живого Supabase і секретів у CI).
  SUPABASE_URL: http://127.0.0.1:54321
  SUPABASE_ANON_KEY: test-anon
  NEXT_TELEMETRY_DISABLED: "1"
  SITE_URL: http://localhost:3100
  # SEO міряємо як після запуску: інакше is-crawlable провалюється через навмисний noindex.
  SITE_INDEXING: "on"

jobs:
  lighthouse:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-26.04
    # 11 сторінок × 5 прогонів: 19,5 хв (13.11, 7d13f62) — 20 хв обривало прогін на останній сторінці; запас під нові сторінки.
    # 15 сторінок × 5 прогонів ≈ 30 хв на повільному ранері (13.11: 13 сторінок — 26–27 хв при BI ~1 750).
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - name: Фейкова база (фікстура e2e/fixtures/db)
        run: |
          node scripts/dev/fake-postgrest.mjs > /tmp/fake-postgrest.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null -H "apikey: x" -H "accept-profile: f1" http://127.0.0.1:54321/rest/v1/site_meta && exit 0; sleep 1; done
          cat /tmp/fake-postgrest.log; exit 1
      - run: npm run build

      - name: Версія Playwright
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Кеш браузерів Playwright
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.ImageOS }}-${{ steps.pw.outputs.version }}

      - name: Встановити Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      # Через apt (дзеркала Ubuntu): 11.11 DNS security.ubuntu.com на раннері падав і валив увесь прогін.
      # Образ раннера вже має бібліотеки Chrome; якщо чогось бракує — e2e/Lighthouse впадуть із явною помилкою.
      - name: Системні залежності Chromium
        continue-on-error: true
        timeout-minutes: 5
        run: npx playwright install-deps chromium

      - name: Сервер
        run: |
          npx next start -p 3100 > next.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3100/ > /dev/null && exit 0; sleep 1; done
          cat next.log; exit 1

      - name: Lighthouse (мобільний, медіана 5 прогонів)
        run: |
          export CHROME_PATH="$(node -p "require('playwright-core').chromium.executablePath()")"
          export LH_NO_SANDBOX=1
          node scripts/lighthouse.mjs --runs 5 --out lighthouse-report

      - name: Звіти
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-report
          path: lighthouse-report/
          retention-days: 14
