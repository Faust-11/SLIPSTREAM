name: DB

# Схема f1 і завантажувачі на чистому Postgres (service container): міграції, повний дамп Jolpica,
# права доступу, тести синхронізації й похідних даних. Supabase тут не використовується.
on:
  pull_request:
    paths:
      - "supabase/**"
      - "scripts/jolpica/**"
      - "scripts/db/**"
      - "scripts/requirements.txt"
      - "src/data/curated/**"
      - ".github/workflows/db.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  db:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.10
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Залежності
        run: pip install -r scripts/requirements.txt
      - name: Ключ кешу дампу (SHA-256 з API Jolpica)
        id: dump
        run: echo "sha=$(python scripts/jolpica/load_dump.py --print-hash)" >> "$GITHUB_OUTPUT"
      - name: Кеш дампу
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dump_csv.zip
          key: jolpica-dump-${{ steps.dump.outputs.sha }}
      - name: Завантажити дамп
        if: steps.cache.outputs.cache-hit != 'true'
        run: python scripts/jolpica/load_dump.py --download --save dump_csv.zip
      - name: Ролі Supabase і міграції
        run: |
          python -c "import os, psycopg; psycopg.connect(os.environ['DATABASE_URL'], autocommit=True).execute(open('scripts/db/supabase_stub.sql').read())"
          python scripts/db/apply_migrations.py
      - name: Дамп у базу
        run: python scripts/jolpica/load_dump.py --zip dump_csv.zip
      - name: Кураторські дані (команди) і доливка гонок після дампу з API Jolpica
        run: |
          python scripts/db/seed_curated.py --strict
          python scripts/jolpica/topup_api.py
      - name: Права доступу (RLS)
        run: |
          python scripts/db/rls_smoke.py
          # Повторний прогін міграцій — ПІСЛЯ перевірки прав: на бою міграції застосовуються один раз, а повтор
          # знову виконує блок журналу (revoke) і маскував би права, які видала сама міграція (11.11 так і сталося).
          python scripts/db/apply_migrations.py | tee /dev/stderr | grep -q "no pending migrations"
          python scripts/db/rls_smoke.py
      - name: Синхронізація й похідні дані команд
        env:
          DUMP_ZIP: dump_csv.zip
        run: python scripts/db/test_data.py
      # Фаза 9b: схема play — очки (кожне правило), дедлайн, права, видимість, чемпіони; паритет з еталоном Python на
      # реальних результатах 2025 з дампу (scripts/db/play_reference.py, фікстура — scripts/db/fixtures).
      - name: "Схема play (прогнози) — очки, дедлайн, права, паритет 2025"
        run: python scripts/db/test_play.py
      # Міграція 0016 має переживати повторне виконання (рев'ю PR #65): журнал apply_migrations.py застосовує файл раз, але ручний
      # прогін у SQL Editor чи відновлення після збою не повинні падати на «already exists».
      - name: "Міграція 0016 повторно (ідемпотентність)"
        run: |
          python -c "import os, psycopg; c = psycopg.connect(os.environ['DATABASE_URL'], autocommit=True); c.execute(open('supabase/migrations/0016_play_delete_account.sql').read()); r = c.execute(\"select (select count(*) from pg_indexes where schemaname='play' and indexname='profiles_nick_key_idx'), (select count(*) from information_schema.columns where table_schema='play' and table_name='profiles' and column_name='nick_key'), (select count(*) from pg_constraint where conname='profiles_nick_chk')\").fetchone(); assert r == (1, 1, 1), r; print('0016 повторно: ок', r)"
          python scripts/db/rls_smoke.py
      - name: Фікстура для сайту (unit/e2e) — артефакт
        run: python scripts/db/export_fixture.py db-fixture
      # Бойовий порядок data-sync.yml: завантажувачі не оновлюють подання, check_live --publish — лише після перевірки.
      # Сценарій збою: новий дамп очистив доливку, а доливка не відпрацювала → публікація має відкотитись.
      - name: Публікація лише перевірених даних (як на бою)
        env:
          F1_DEFER_REFRESH: "1"
        run: |
          snap() { python -c "import os, psycopg; print(psycopg.connect(os.environ['DATABASE_URL']).execute(\"select md5(string_agg(t::text, '|' order by id)) || (select last_round::text from f1.site_meta) from f1.team_index t\").fetchone()[0])"; }
          published=$(snap)
          python scripts/jolpica/load_dump.py --zip dump_csv.zip
          if python scripts/db/check_live.py --publish; then echo "очікували FAIL: доливку очищено"; exit 1; fi
          test "$(snap)" = "$published" || { echo "подання змінились попри ROLLBACK"; exit 1; }
          python scripts/jolpica/topup_api.py
          python scripts/db/check_live.py --publish
          test "$(snap)" = "$published" || { echo "після доливки подання мають збігтися з опублікованими"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: db-fixture
          path: db-fixture/
          retention-days: 14
