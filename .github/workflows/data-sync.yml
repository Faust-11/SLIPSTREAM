name: Data sync

# Бойова база (Supabase, схема f1): міграції → дамп Jolpica (якщо новий) → кураторські дані → доливка гонок
# після дампу з API → перевірка → перезбірка сайту (deploy hook Vercel). Секрети — у GitHub (вставляє власник):
#   DATABASE_URL        — Supabase → Connect → Session pooler (роль postgres);
#   VERCEL_DEPLOY_HOOK  — Vercel → Settings → Git → Deploy Hooks (гілка main).
on:
  schedule:
    - cron: "0 6 * * 1"   # понеділок 06:00 UTC — після гоночних вихідних
    - cron: "0 6 * * 4"   # четвер — пізні зміни результатів, новий дамп (щовівторка)
  workflow_dispatch:

concurrency:
  group: data-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: Замір до (розмір, таблиці Predictor; стоп, якщо схема f1 чужа)
        run: python scripts/db/measure_live.py before "$RUNNER_TEMP/db-before.json"
      - name: Міграції
        run: python scripts/db/apply_migrations.py
      - name: Дамп Jolpica (лише новий)
        run: python scripts/jolpica/load_dump.py --download --skip-if-loaded
      - name: Кураторські дані (команди)
        run: python scripts/db/seed_curated.py --strict
      - name: Доливка гонок після дампу (API Jolpica)
        run: python scripts/jolpica/topup_api.py
      - name: Перевірка даних
        run: python scripts/db/check_live.py
      # Перевірка прав саме на бою: 11.11 вона знайшла читання f1.schema_migrations для anon, якого CI не бачив (0003).
      - name: Права доступу на бою (тестові зміни відкочуються)
        run: python scripts/db/rls_smoke.py
      - name: Замір після (приріст, таблиці Predictor без змін, ліміт 500 МБ)
        run: python scripts/db/measure_live.py after "$RUNNER_TEMP/db-before.json"
      - name: Перезбірка сайту
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          test -n "$VERCEL_DEPLOY_HOOK" || { echo "VERCEL_DEPLOY_HOOK не задано"; exit 1; }
          # Діагностика без розкриття секрету: лише хост, пробіли/переноси, код і тіло відповіді (id задачі або помилка).
          case "$VERCEL_DEPLOY_HOOK" in *[[:space:]]*) echo "VERCEL_DEPLOY_HOOK містить пробіл або перенос рядка"; exit 1;; esac
          echo "хост: $(printf '%s' "$VERCEL_DEPLOY_HOOK" | cut -d/ -f1-3)"
          code=$(curl -sS -o hook.json -w '%{http_code}' -X POST "$VERCEL_DEPLOY_HOOK" || echo 000)
          echo "deploy hook: HTTP $code $(head -c 300 hook.json 2>/dev/null)"
          test "$code" -ge 200 && test "$code" -lt 300
