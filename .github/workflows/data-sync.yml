name: Data sync

# Бойова база (Supabase, схема f1): міграції → дамп Jolpica (якщо новий) → кураторські дані → доливка гонок
# після дампу з API → перевірка й публікація подань → перезбірка сайту (deploy hook Vercel). Секрети — у GitHub (вставляє власник):
#   DATABASE_URL        — Supabase → Connect → Session pooler (роль postgres);
#   VERCEL_DEPLOY_HOOK  — Vercel → Settings → Git → Deploy Hooks (гілка main).
on:
  schedule:
    - cron: "0 6 * * 1"   # понеділок 06:00 UTC — після гоночних вихідних
    - cron: "0 6 * * 4"   # четвер — пізні зміни результатів, новий дамп (щовівторка)
    # Гоночні вихідні (рішення користувача 14.11 — результати якомога швидше): щогодини легка перевірка (job gate), чи є в
    # Jolpica результат гонки, якого ще немає в базі; лише тоді — повна синхронізація. Нд 06:00–23:00 і пн 00:00–05:00 UTC
    # (покриває і нічні гонки — Лас-Вегас ~04:00 UTC нд), березень–грудень. Бюджет: ~24 запуски × 1 хв на тиждень.
    - cron: "0 6-23 * 3-12 0"
    - cron: "0 0-5 * 3-12 1"
  workflow_dispatch:

concurrency:
  group: data-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    # Лише для щогодинних запусків: результат останньої гонки в API Jolpica є, а в базі ще немає → new=true.
    # Без checkout і pip (≈ 10 с): curl + psql клієнт раннера.
    if: github.event_name == 'schedule' && github.event.schedule != '0 6 * * 1' && github.event.schedule != '0 6 * * 4'
    runs-on: ubuntu-26.04
    timeout-minutes: 3
    outputs:
      new: ${{ steps.check.outputs.new }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - id: check
        run: |
          set -euo pipefail
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null; }
          last=$(curl -fsS --max-time 30 https://api.jolpi.ca/ergast/f1/current/last/results.json | jq -r '.MRData.RaceTable.Races[0] | "\(.season) \(.round)"')
          read -r season round <<< "$last"
          [[ "$season" =~ ^[0-9]{4}$ && "$round" =~ ^[0-9]{1,2}$ ]] || { echo "API: несподівана відповідь «$last»"; echo "new=false" >> "$GITHUB_OUTPUT"; exit 0; }
          have=$(psql "$DATABASE_URL" -Atc "select exists (select 1 from f1.results x join f1.sessions s on s.id = x.session_id join f1.rounds r on r.id = s.round_id where s.type = 'R' and r.season_year = $season and r.number = $round)")
          echo "API: $season/$round; у базі: $have"
          echo "new=$([ "$have" = f ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  sync:
    needs: gate
    # Лише main: ручний запуск з іншої гілки застосував би до бою її незлиті міграції (журнал їх запам'ятає,
    # і виправлена до злиття версія вже не накотиться). Щогодинний запуск — лише коли gate знайшов новий результат;
    # пн/чт і ручний — завжди (gate тоді пропущено — !cancelled() не дає пропуску поширитись на sync).
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      (github.event_name != 'schedule' || github.event.schedule == '0 6 * * 1' || github.event.schedule == '0 6 * * 4' ||
       needs.gate.outputs.new == 'true')
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Завантажувачі не оновлюють подання сайту (team_index, site_meta) — це робить check_live.py --publish
      # після всіх кроків і перевірок, в одній транзакції. Збій посередині лишає сайту дані минулої вдалої синхронізації.
      F1_DEFER_REFRESH: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: Замір до (розмір, таблиці Predictor; стоп, якщо схема f1 чужа)
        run: python scripts/db/measure_live.py before "$RUNNER_TEMP/db-before.json"
      - name: Міграції
        run: python scripts/db/apply_migrations.py
      - name: Дамп Jolpica (лише новий)
        run: python scripts/jolpica/load_dump.py --download --skip-if-loaded
      # Невіднесених конструкторів перевіряє check_live.py — після доливки, яка теж може додати нового учасника.
      - name: Кураторські дані (команди)
        run: python scripts/db/seed_curated.py
      - name: Доливка гонок після дампу (API Jolpica)
        run: python scripts/jolpica/topup_api.py
      - name: Перевірка й публікація даних (FAIL — подання не оновлюються)
        run: python scripts/db/check_live.py --publish
      # Очки «Прогнозів» (фаза 9b): повний перерахунок усіх етапів, де є прогнози (ідемпотентно: рядки змінюються лише при
      # зміні результату, тож пізні штрафи теж підхоплюються). Збій не блокує публікацію даних і перезбірку сайту (гра окрема
      # від історії), але валить прогін в кінці (крок «Збій підрахунку очків»), щоб його не пропустили.
      - name: Очки прогнозів (play.score_all)
        id: play_score
        continue-on-error: true
        run: |
          python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ["DATABASE_URL"], autocommit=True) as c:
              print("оцінено прогнозів:", c.execute("select play.score_all()").fetchone()[0])
          PY
      # Перевірка прав саме на бою: 11.11 вона знайшла читання f1.schema_migrations для anon, якого CI не бачив (0003).
      - name: Права доступу на бою (тестові зміни відкочуються)
        run: python scripts/db/rls_smoke.py
      - name: Замір після (приріст, таблиці Predictor без змін, ліміт 500 МБ)
        run: python scripts/db/measure_live.py after "$RUNNER_TEMP/db-before.json"
      - name: Перезбірка сайту
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          test -n "$VERCEL_DEPLOY_HOOK" || { echo "VERCEL_DEPLOY_HOOK не задано"; exit 1; }
          # Діагностика без розкриття секрету: лише хост, пробіли/переноси, код і тіло відповіді (id задачі або помилка).
          case "$VERCEL_DEPLOY_HOOK" in *[[:space:]]*) echo "VERCEL_DEPLOY_HOOK містить пробіл або перенос рядка"; exit 1;; esac
          echo "хост: $(printf '%s' "$VERCEL_DEPLOY_HOOK" | cut -d/ -f1-3)"
          code=$(curl -sS -o hook.json -w '%{http_code}' -X POST "$VERCEL_DEPLOY_HOOK" || echo 000)
          echo "deploy hook: HTTP $code $(head -c 300 hook.json 2>/dev/null)"
          test "$code" -ge 200 && test "$code" -lt 300
      - name: Збій підрахунку очків прогнозів
        if: steps.play_score.outcome == 'failure'
        run: |
          echo "::error::play.score_all() завершилась помилкою — очки прогнозів не оновлено (дані сайту опубліковано), див. крок «Очки прогнозів»"
          exit 1
