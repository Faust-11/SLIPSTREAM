name: Автозлиття правок адмінки

# Рішення користувача 15.11: правки контенту з адмінки (/admin) зливаються самі після зеленого CI. Лише PR з гілки
# admin/* цього ж репозиторію в main, з міткою admin, не чернетка, без нових комітів після перевірки, і ТІЛЬКИ файли
# контенту (тексти історій, src/data/curated/*.json, public/img/**/*.webp) — правило src/lib/admin/admin-paths.mjs. Будь-що інше —
# PR чекає ручного злиття.
#
# Безпека: workflow_run виконується з main і з токеном на запис — код PR тут НЕ запускається (checkout лише main,
# правило — з main); дані події передаються через env, не підставляються в скрипт.
# Злиття — лише коли ВСІ перевірки коміту зелені (CI, Lighthouse, DB, Vercel): запускається після кожної з них, а
# спрацьовує та, що завершилась останньою (рев'ю 7a: DB перевіряє seed_curated.py --strict для src/data/curated).
# Плюс статус Vercel: якщо прев'ю збереться останнім, злиття запустить саме він (code-review 7a: інакше PR висів би).
on:
  workflow_run:
    workflows: [CI, Lighthouse, DB]
    types: [completed]
  status:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: admin-merge-${{ github.event.workflow_run.head_sha || github.event.sha }}
  cancel-in-progress: false

jobs:
  merge:
    # Попередній фільтр (дешевий); остаточне рішення — merge-gate за даними GitHub, а не події.
    if: >-
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'pull_request' &&
        startsWith(github.event.workflow_run.head_branch, 'admin/') &&
        github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'status' && github.event.context == 'Vercel' && github.event.state == 'success')
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            .nvmrc
            src/lib/admin/admin-paths.mjs
            scripts/admin/merge-gate.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Перевірити й злити
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha || github.event.sha }}
        run: |
          # PR — за комітом (обидві події його знають), лише відкритий з гілки admin/* цього репозиторію.
          number=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TESTED_SHA/pulls" \
            -q "[.[] | select(.state == \"open\" and (.head.ref | startswith(\"admin/\")) and .head.repo.full_name == \"$GITHUB_REPOSITORY\")][0].number // empty")
          if [ -z "$number" ]; then echo "Відкритого PR адмінки для $TESTED_SHA немає"; exit 0; fi
          gh pr view "$number" -R "$GITHUB_REPOSITORY" --json headRefName,baseRefName,headRefOid,isDraft,isCrossRepository,state,labels > "$RUNNER_TEMP/pr.json"
          # Файли — з REST: на відміну від `gh pr view --json files` там є previous_filename і статус (перейменування).
          gh api "repos/$GITHUB_REPOSITORY/pulls/$number/files?per_page=100" > "$RUNNER_TEMP/files.json"
          gh api "repos/$GITHUB_REPOSITORY/commits/$TESTED_SHA/check-runs?per_page=100" > "$RUNNER_TEMP/checks.json"
          gh api "repos/$GITHUB_REPOSITORY/commits/$TESTED_SHA/status" > "$RUNNER_TEMP/status.json"
          if ! node scripts/admin/merge-gate.mjs "$TESTED_SHA" "$RUNNER_TEMP/pr.json" "$RUNNER_TEMP/files.json" "$RUNNER_TEMP/checks.json" "$RUNNER_TEMP/status.json"; then
            echo "PR #$number лишається на ручне злиття."
            exit 0
          fi
          # --match-head-commit: якщо між перевіркою й злиттям з'явився коміт — GitHub відмовить.
          gh pr merge "$number" -R "$GITHUB_REPOSITORY" --rebase --match-head-commit "$TESTED_SHA" --delete-branch
