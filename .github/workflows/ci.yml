name: CI

# Повні перевірки — після готової сторінки (рішення користувача 11.11): на PR-чернетках не запускаємо,
# лише коли PR готовий до рев'ю (і на кожен наступний коміт у ньому), у main і вручну.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Скасовуємо застарілі прогони лише в PR: кожен коміт у main має отримати свій статус.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Дані сайту — фейковий PostgREST з фікстурою (без живого Supabase і секретів у CI).
  SUPABASE_URL: http://127.0.0.1:54321
  SUPABASE_ANON_KEY: test-anon
  NEXT_TELEMETRY_DISABLED: "1"
  # Збірка для e2e: абсолютні URL у метаданих = адреса next start у тестах.
  SITE_URL: http://localhost:3100

jobs:
  check:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - name: Фейкова база (фікстура e2e/fixtures/db)
        run: |
          node scripts/dev/fake-postgrest.mjs > /tmp/fake-postgrest.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null -H "apikey: x" -H "accept-profile: f1" http://127.0.0.1:54321/rest/v1/site_meta && break; sleep 1; done
      - run: npm run build

      - name: Версія Playwright
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Кеш браузерів Playwright
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.ImageOS }}-${{ steps.pw.outputs.version }}

      - name: Встановити Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      # Через apt (дзеркала Ubuntu): 11.11 DNS security.ubuntu.com на раннері падав і валив увесь прогін.
      # Образ раннера вже має бібліотеки Chrome; якщо чогось бракує — e2e/Lighthouse впадуть із явною помилкою.
      - name: Системні залежності Chromium
        continue-on-error: true
        timeout-minutes: 5
        run: npx playwright install-deps chromium

      - name: e2e
        id: e2e
        run: npm run e2e

      - name: Звіт Playwright
        if: failure() && steps.e2e.conclusion == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
